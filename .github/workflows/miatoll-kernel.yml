name: DOOM Kernel — miatoll (Clang 22)

on:
  push:
    branches:
      - 'arena/**'
      - '16'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      # Both variants must be reported even if one of them fails.
      fail-fast: false
      matrix:
        # nocal: KCal compiled out (the configuration XDA/most builds ship)
        # kcal : CONFIG_DRM_MSM_KCAL_CTRL=y, kernel-level colour calibration
        variant: [nocal, kcal]
    env:
      TOOLCHAIN_ROOT: ${{ github.workspace }}/.work/toolchain
      BUILDTOOLS_ROOT: ${{ github.workspace }}/.work/build-tools
      OUT_DIR: ${{ github.workspace }}/out/miatoll-${{ matrix.variant }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio curl git xz-utils python3

      - name: Free runner disk space
        run: |
          # The Clang 22 release tarball is ~1.9 GB and expands to several GB,
          # then the kernel build needs a few more; drop unused preinstalled
          # SDKs so the runner does not run out of disk mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Cache pinned LLVM toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            .work/toolchain
            .work/build-tools
          key: llvm-22.1.8-buildtools-f61cfbcb-${{ runner.os }}

      - name: Fetch and verify pinned toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: scripts/fetch-llvm.sh

      - name: Build DOOM Kernel for miatoll (${{ matrix.variant }})
        run: scripts/build-miatoll.sh

      # Run logs are not always downloadable from outside CI, so surface the
      # failing diagnostic as check-run annotations that any API client can
      # read (they also show up on the PR/commit page).
      - name: Report build errors as annotations
        if: failure()
        run: |
          report() {  # $1 = log file, $2 = how many lines
            local log="$1" n="$2"
            if grep -qE 'error:|Error [0-9]|ERROR:' "$log"; then
              grep -E 'error:|Error [0-9]|ERROR:' "$log" | head -"$n" | while IFS= read -r l; do
                echo "::error title=build($VARIANT)::$(printf '%s' "$l" | cut -c1-900)"
              done
            else
              tail -"$n" "$log" | while IFS= read -r l; do
                echo "::error title=build($VARIANT)::$(printf '%s' "$l" | cut -c1-900)"
              done
            fi
          }
          found=0
          for f in "$OUT_DIR"/logs/build.log \
                   "$OUT_DIR"/logs/defconfig.log \
                   "$OUT_DIR"/logs/config-validation.log \
                   "$OUT_DIR"/logs/toolchain.txt; do
            [ -f "$f" ] || continue
            found=1
            echo "::notice::$f ($(wc -l < "$f") lines)"
            case "$f" in
              */build.log)             report "$f" 8 ;;
              */defconfig.log)         report "$f" 6 ;;
              */config-validation.log) report "$f" 4 ;;
            esac
          done
          [ "$found" = 1 ] || echo "::error title=build($VARIANT)::no logs were produced at all"

      - name: Package DOOM Kernel AnyKernel3 ZIP (${{ matrix.variant }})
        run: scripts/package-anykernel.sh

      - name: Upload DOOM Kernel raw build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Kernel-miatoll-${{ matrix.variant }}-raw-${{ github.sha }}
          path: |
            ${{ env.OUT_DIR }}/artifacts/
            ${{ env.OUT_DIR }}/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DOOM Kernel ZIP (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Kernel-miatoll-${{ matrix.variant }}-${{ github.sha }}
          path: |
            ${{ env.OUT_DIR }}/anykernel/*.zip
            ${{ env.OUT_DIR }}/anykernel/*.zip.sha256
          if-no-files-found: warn
          retention-days: 14
