name: DOOM Kernel — miatoll (Clang 22)

on:
  push:
    branches:
      - 'arena/**'
      - '16'
  pull_request:
  workflow_dispatch:

permissions:
  # Publishing the flashable ZIP as a release asset needs write access; the
  # checkout itself stays read-only.
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_ROOT: ${{ github.workspace }}/.work/toolchain
  BUILDTOOLS_ROOT: ${{ github.workspace }}/.work/build-tools
  # One build, one output directory: KCal is always compiled in and the
  # colour-block owner is chosen at flash time.
  OUT_DIR: ${{ github.workspace }}/out/miatoll

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio curl git xz-utils python3

      - name: Free runner disk space
        run: |
          # The Clang 22 release tarball is ~1.9 GB and expands to several GB,
          # then the kernel build needs a few more; drop unused preinstalled
          # SDKs so the runner does not run out of disk mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Cache pinned LLVM toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            .work/toolchain
            .work/build-tools
          key: llvm-22.1.8-buildtools-f61cfbcb-${{ runner.os }}

      - name: Fetch and verify pinned toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: scripts/fetch-llvm.sh

      - name: Build DOOM Kernel for miatoll
        run: scripts/build-miatoll.sh

      # Run logs are not always downloadable from outside CI, so surface the
      # failing diagnostic as check-run annotations that any API client can
      # read (they also show up on the PR/commit page).
      - name: Report build errors as annotations
        if: failure()
        run: |
          report() {  # $1 = log file, $2 = how many lines
            local log="$1" n="$2"
            if grep -qE 'error:|Error [0-9]|ERROR:' "$log"; then
              grep -E 'error:|Error [0-9]|ERROR:' "$log" | head -"$n" | while IFS= read -r l; do
                echo "::error title=build::$(printf '%s' "$l" | cut -c1-900)"
              done
            else
              tail -"$n" "$log" | while IFS= read -r l; do
                echo "::error title=build::$(printf '%s' "$l" | cut -c1-900)"
              done
            fi
          }
          found=0
          for f in "$OUT_DIR"/logs/build.log \
                   "$OUT_DIR"/logs/defconfig.log \
                   "$OUT_DIR"/logs/config-validation.log \
                   "$OUT_DIR"/logs/toolchain.txt; do
            [ -f "$f" ] || continue
            found=1
            echo "::notice::$f ($(wc -l < "$f") lines)"
            case "$f" in
              */build.log)             report "$f" 8 ;;
              */defconfig.log)         report "$f" 6 ;;
              */config-validation.log) report "$f" 4 ;;
            esac
          done
          [ "$found" = 1 ] || echo "::error title=build::no logs were produced at all"

      - name: Package the flashable AnyKernel3 ZIP
        run: scripts/package-anykernel.sh

      # The ZIP produced by the packaging step IS the deliverable. Artifacts are
      # always re-zipped by GitHub, so a flashable ZIP published as an artifact
      # arrives as a ZIP inside a ZIP; a release asset is served as-is.
      - name: Publish the flashable ZIP as the only release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=ci-latest
          zip="$(ls -t "$OUT_DIR"/anykernel/*.zip 2>/dev/null | head -1 || true)"
          [ -f "$zip" ] || { echo "::error::no flashable ZIP was produced"; exit 1; }
          asset="$(basename "$zip")"
          sum="$(cut -d' ' -f1 "$zip.sha256")"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"

          {
            echo "Automatic build of \`$GITHUB_SHA\`."
            echo
            echo "| file | sha256 |"
            echo "| --- | --- |"
            echo "| \`$asset\` | \`$sum\` |"
            echo
            echo "Direct download: <$url>"
            echo
            echo "Flash it from a custom recovery (TWRP / OrangeFox / Lineage"
            echo "Recovery). The installer asks with the volume keys whether KCal"
            echo "owns the DSPP colour block, then writes that answer into the boot"
            echo "image cmdline as \`doom.kcal=0|1\`; no key within 10 s means KCal"
            echo "off. See \`README.txt\` inside the ZIP for the runtime toggle."
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" \
              --title "DOOM Kernel — miatoll (newest build)" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          fi

          # Exactly one asset: drop whatever a previous commit left behind.
          gh release view "$tag" --json assets --jq '.assets[].name' |
            while IFS= read -r old; do
              [ -z "$old" ] || [ "$old" = "$asset" ] ||
                gh release delete-asset "$tag" "$old" --yes ||
                echo "::warning title=release::could not delete stale asset $old"
            done

          gh release upload "$tag" "$zip" --clobber
          echo "Published $asset ($sum)"
          echo "::notice title=Download::$url"
