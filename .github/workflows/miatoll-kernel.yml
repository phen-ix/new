name: DOOM Kernel — miatoll (Clang 22)

on:
  push:
    branches:
      - 'arena/**'
      - '16'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TOOLCHAIN_ROOT: ${{ github.workspace }}/.work/toolchain
      BUILDTOOLS_ROOT: ${{ github.workspace }}/.work/build-tools
      OUT_DIR: ${{ github.workspace }}/out/miatoll
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio curl git xz-utils python3

      - name: Free runner disk space
        run: |
          # The Clang 22 release tarball is ~1.9 GB and expands to several GB,
          # then the kernel build needs a few more; drop unused preinstalled
          # SDKs so the runner does not run out of disk mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Cache pinned LLVM toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            .work/toolchain
            .work/build-tools
          key: llvm-22.1.8-buildtools-f61cfbcb-${{ runner.os }}

      - name: Fetch and verify pinned toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: scripts/fetch-llvm.sh

      - name: Build DOOM Kernel for miatoll
        run: scripts/build-miatoll.sh

      # Run logs are not always downloadable from outside CI, so surface the
      # first compile errors as check-run annotations that any API client can
      # read (they also show up on the PR/commit page).
      - name: Report build errors as annotations
        if: failure()
        run: |
          LOG=out/miatoll/logs/build.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=build::no build log at $LOG"
            exit 0
          fi
          echo "build log: $(wc -l < "$LOG") lines"
          fail_line=$(grep -n -m1 'Error [0-9]' "$LOG" | cut -d: -f1 || true)
          if [ -n "$fail_line" ]; then
            sed -n "$((fail_line > 25 ? fail_line - 25 : 1)),${fail_line}p" "$LOG" \
              | grep -E 'error:|Error [0-9]' | tail -8 | while IFS= read -r line; do
                  echo "::error title=compile::$(printf '%s' "$line" | cut -c1-900)"
                done
          else
            grep -m8 -E 'error:' "$LOG" | while IFS= read -r line; do
              echo "::error title=compile::$(printf '%s' "$line" | cut -c1-900)"
            done
          fi

      - name: Package DOOM Kernel AnyKernel3 ZIP
        run: scripts/package-anykernel.sh

      - name: Upload DOOM Kernel raw build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Kernel-miatoll-raw-${{ github.sha }}
          path: |
            out/miatoll/artifacts/
            out/miatoll/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DOOM Kernel ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Kernel-miatoll-${{ github.sha }}
          path: |
            out/miatoll/anykernel/*.zip
            out/miatoll/anykernel/*.zip.sha256
          if-no-files-found: warn
          retention-days: 14
