# DOOM Kernel — HyperOS Port Profile (miatoll)
# Target ROM: HyperOS_Miatoll_20261107_@iputobject_OS3.0.3.0.VLCCNXM_15.zip
#             sha256 783ad4f7be1330483aedab39344921a1ca9df9d3ca519634352db0430a60264c
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE IS
#
# A declaration of the kernel runtime knobs that the DOOM HyperOS profile is
# allowed to touch, the value currently in effect in the DOOM kernel *as built
# from this tree*, and the evidence gate that must open before a different
# value may be written.
#
# Fields (whitespace separated):
#   <node>  <target>  <min>  <max>  <gate>  <evidence-id>
#
#   target = "-"      observe-only: read and record, never write
#   gate   = READY    value is justified by evidence already on file
#   gate   = PENDING  no device/ROM evidence yet -> engine will NOT write it
#                     unless the operator passes --allow-pending explicitly
#   min/max           bounds the engine enforces (from the kernel handler)
#
# ---------------------------------------------------------------------------
# WHY EVERY ENTRY IS STILL 'PENDING'
#
# The project rule is: a value may only be changed with evidence from
# (1) the target ROM package, (2) this kernel's source, (3) runtime logs from
# the device, or (4) measured performance/thermal/memory data.
#
# This file was written with (2) only: every 'target' below is the value that
# this kernel tree actually produces (config default or hard-coded default), and
# every bound comes from the sysctl/Kconfig definition. The *current* values are
# therefore correct-by-construction and the profile is a functional no-op until
# ROM/device evidence arrives. See hyperos/REPORT.md sections E/G and
# hyperos/evidence/EVIDENCE-REQUIRED.md.
# ---------------------------------------------------------------------------


# ===========================================================================
# 1. CPUFREQ / SCHEDUTIL
#    Source: kernel/sched/cpufreq_schedutil.c  (gov attrs: up_rate_limit_us,
#            down_rate_limit_us, iowait_boost_enable)
#            drivers/cpufreq/Kconfig: SCHEDUTIL_UP_RATE_LIMIT (default 1000),
#            SCHEDUTIL_DOWN_RATE_LIMIT (default 1000)
#            arch/arm64/configs/vendor/xiaomi/miatoll_defconfig: UP=500
#            miatoll_defconfig does NOT override DOWN -> 1000
#            cpufreq_schedutil.c sugov_init(): iowait_boost_enable = false
#    Policies: policy0 = CPUs 0-5 (300 MHz..1.8048 GHz),
#              policy6 = CPUs 6-7 (652.8 MHz..2.3232 GHz)
#              (arch/arm64/boot/dts/qcom/atoll.dtsi, qcom,cpufreq-table-0/-6)
#    Hypothesis to test (E-01): UI jank is caused by schedutil clipping or
#    delaying frequency decisions (rate-limit vs. WALT window). This can only
#    be proven by ftrace (sched_switch + cpu_frequency) on the target ROM, not
#    by convention, so the value stays at the kernel default for now.
# ===========================================================================
/sys/devices/system/cpu/cpufreq/policy0/schedutil/up_rate_limit_us    500   0 2000000 PENDING E-01
/sys/devices/system/cpu/cpufreq/policy6/schedutil/up_rate_limit_us    500   0 2000000 PENDING E-01
/sys/devices/system/cpu/cpufreq/policy0/schedutil/down_rate_limit_us 1000   0 2000000 PENDING E-01
/sys/devices/system/cpu/cpufreq/policy6/schedutil/down_rate_limit_us 1000   0 2000000 PENDING E-01
/sys/devices/system/cpu/cpufreq/policy0/schedutil/iowait_boost_enable   0   0       1 PENDING E-02
/sys/devices/system/cpu/cpufreq/policy6/schedutil/iowait_boost_enable   0   0       1 PENDING E-02


# ===========================================================================
# 2. WALT SCHEDULER / MIGRATION
#    Source: kernel/sysctl.c (proc names + .extra1/.extra2 bounds),
#            kernel/sched/fair.c (defaults), kernel/sched/walt.c
#    Note: sched_upmigrate / sched_downmigrate are ARRAYS
#          (maxlen = sizeof(uint) * MAX_MARGIN_LEVELS) and are deliberately
#          NOT listed here: writing a scalar into an array sysctl is not
#          well-defined for a profile engine.
# ===========================================================================
/proc/sys/kernel/sched_group_upmigrate          100   0  100 PENDING E-03
/proc/sys/kernel/sched_group_downmigrate         95   0  100 PENDING E-03
/proc/sys/kernel/sched_boost                      0  -3    3 PENDING E-04
/proc/sys/kernel/sched_conservative_pl            0   0    1 PENDING E-05
/proc/sys/kernel/sched_many_wakeup_threshold   1000   2 1000 PENDING E-05
/proc/sys/kernel/sched_min_task_util_for_boost   51   0 1000 PENDING E-05
/proc/sys/kernel/sched_min_task_util_for_colocation 35 0 1000 PENDING E-05
/proc/sys/kernel/sched_little_cluster_coloc_fmin_khz 1000000 0 2000000 PENDING E-06


# ===========================================================================
# 3. CORE_CTL (Qualcomm hotplug / cluster control)
#    Source: kernel/sched/core_ctl.c -> kobject_add(&cluster->kobj,
#            &dev->kobj, "core_ctl")  => <cpu device>/core_ctl/<attr>
#            attrs: min_cpus max_cpus offline_delay_ms busy_up_thres
#                   busy_down_thres task_thres nr_prev_assist_thresh enable
#    IMPORTANT: the *values* are supplied by the device tree that ships in the
#    ROM's boot.img/dtbo.img, not by this kernel tree (this tree has no
#    miatoll DTS at all). Target is therefore "-" until the ROM DT is decoded.
# ===========================================================================
/sys/devices/system/cpu/cpu6/core_ctl/enable            -   -    - PENDING E-07
/sys/devices/system/cpu/cpu6/core_ctl/min_cpus          -   -    - PENDING E-07
/sys/devices/system/cpu/cpu6/core_ctl/max_cpus          -   -    - PENDING E-07
/sys/devices/system/cpu/cpu6/core_ctl/offline_delay_ms  -   -    - PENDING E-07
/sys/devices/system/cpu/cpu6/core_ctl/busy_up_thres     -   -    - PENDING E-07
/sys/devices/system/cpu/cpu6/core_ctl/busy_down_thres   -   -    - PENDING E-07


# ===========================================================================
# 4. CPU_BOOST (Qualcomm input boost, kernel side)
#    Source: drivers/cpufreq/cpu-boost.c, CONFIG_CPU_BOOST=y in
#            vendor/atoll-perf_defconfig:100 and vendor/xiaomi/miatoll_defconfig
#            module params: input_boost_ms (default 40), input_boost_freq
#            (per-cpu, set from DT), sched_boost_on_input (default 0)
#    KNOWN RISK (E-08): both the kernel cpu_boost and the ROM's PowerHAL can
#    raise frequencies on touch. Double-boosting shows up as excess big-core
#    residency + heat with no frame-time gain; it can only be proven by
#    disabling one side and comparing frame pacing + power.
# ===========================================================================
/sys/module/cpu_boost/parameters/input_boost_ms        40   0 1000 PENDING E-08
/sys/module/cpu_boost/parameters/sched_boost_on_input   0   0    3 PENDING E-08
/sys/module/cpu_boost/parameters/input_boost_freq       -   -    - PENDING E-08


# ===========================================================================
# 5. MEMORY / VM
#    Source: mm/vmscan.c vm_swappiness = 85 (Qualcomm default, not 100),
#            mm/page_alloc.c extra_free_kbytes = 0, watermark_scale_factor = 10,
#            kernel/sysctl.c extra_free_kbytes & watermark_scale_factor handlers
#    lmkd is USERSPACE here: CONFIG_ANDROID_LOW_MEMORY_KILLER is not enabled,
#    CONFIG_HAVE_LOW_MEMORY_KILLER=y + CONFIG_PSI=y, so /proc/pressure/memory
#    feeds Android's lmkd. lmkd thresholds come from ROM props (ro.lmk.*),
#    which is why they are absent from this kernel-side profile.
# ===========================================================================
/proc/sys/vm/swappiness               85    0  200 PENDING E-09
/proc/sys/vm/extra_free_kbytes         0    0 1048576 PENDING E-09
/proc/sys/vm/watermark_scale_factor   10    1 1000 PENDING E-09
/proc/sys/vm/vfs_cache_pressure      100    0 1000 PENDING E-10


# ===========================================================================
# 6. ZRAM (observe first — the size/backend policy belongs to the ROM)
#    Source: drivers/block/zram/zram_drv.c default_compressor = "lz4";
#            zcomp.c backends lzo/lz4/lz4hc/zstd;
#            CONFIG_ZRAM=y, CONFIG_ZRAM_DEDUP=y, CONFIG_ZSMALLOC=y
#    Never write disksize here: resizing a live zram device with pages in it is
#    a data-destroying operation.
# ===========================================================================
/sys/block/zram0/comp_algorithm   -   -   - PENDING E-11
/sys/block/zram0/disksize         -   -   - PENDING E-11
/sys/block/zram0/mem_limit        -   -   - PENDING E-11


# ===========================================================================
# 7. STORAGE / I/O
#    Source: block/Kconfig.iosched -> MQ_IOSCHED_DEADLINE and MQ_IOSCHED_KYBER
#            are explicitly disabled in both atoll and miatoll defconfigs;
#            IOSCHED_CFQ is built (CFQ_GROUP_IOSCHED=y). The scheduler string
#            is an enum ("[cfq]") so it is observe-only here; switching it is a
#            measured decision, not a default.
# ===========================================================================
/sys/block/sda/queue/scheduler     -    -     - PENDING E-12
/sys/block/sda/queue/read_ahead_kb 128  0  8192 PENDING E-12


# ===========================================================================
# 8. GPU (KGSL)
#    Source: drivers/devfreq/governor_msm_adreno_tz.c  .name = "msm-adreno-tz"
#            CONFIG_QCOM_KGSL=y; GPU power levels come from the ROM's DT
#            (atoll reference DT: 825/800/650/565/430/355/267 MHz).
#    Observe-only: the governor *name* must match the DT-independent default,
#    but forcing frequencies would defeat the thermal governor.
# ===========================================================================
/sys/class/kgsl/kgsl-3d0/devfreq/governor        -   -   - PENDING E-13
/sys/class/kgsl/kgsl-3d0/min_pwrlevel            -   -   - PENDING E-13
/sys/class/kgsl/kgsl-3d0/max_pwrlevel            -   -   - PENDING E-13
/sys/class/kgsl/kgsl-3d0/force_clk_on            -   -   - PENDING E-13


# ===========================================================================
# 9. THERMAL — intentionally empty.
#    The profile never writes trip points, cooling-device states or thermal
#    zone modes. CONFIG_THERMAL_WRITABLE_TRIPS=y means it *is* possible, which
#    is exactly why it must stay out of a performance profile: raising trips
#    trades sustained performance and battery health for a short benchmark win.
